<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme") || localStorage.getItem("hotgpt-theme");
          var theme = saved === "dark" ? "dark" : "blood";
          localStorage.setItem("theme", theme);
          localStorage.setItem("hotgpt-theme", theme);
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = "dark";
        } catch (_) {
          document.documentElement.dataset.theme = "blood";
        }
      })();
    </script>
    <style>
      html, body, #root { min-height: 100%; background: var(--bg, #2B0000); color: #FFFFFF; }
      html[data-theme="dark"] { --bg: #000000; --card: #111111; --text: #FFFFFF; --accent: #FFFFFF; }
      html[data-theme="blood"] { --bg: #2B0000; --card: #400000; --text: #FFFFFF; --accent: #FF1E2E; }
      html[data-theme="dark"] body, html[data-theme="blood"] body { background: var(--bg); color: var(--text); }
      html[data-theme="blood"] header { background: #2B0000; color: #FFFFFF; }
    </style>
    <meta name="theme-color" content="#2B0000" />
    <meta name="description" content="HotGPT — بدون قيود، مساعدك الذكي للبرمجة والتحليل والأمن الرقمي." />
    <link rel="icon" type="image/svg+xml" href="/brand-ar.svg" />
    <link rel="apple-touch-icon" href="/brand-ar.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HotGPT" />
    <meta property="og:title" content="HotGPT — بدون قيود" />
    <meta property="og:description" content="مساعدك الذكي للبرمجة والتحليل والأمن الرقمي — بدون قيود." />
    <meta property="og:image" content="/brand-ar.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="HotGPT — بدون قيود" />
    <meta name="twitter:image" content="/brand-ar.svg" />
    <title>HotGPT — بدون قيود</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/api/platform/config"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
